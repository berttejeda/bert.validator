# Define variables available to the template engine
templateVars:
  app_name: "MyApp"

# Global default interpreter and settings
defaults:
  show_output: false
  interpreters:
    script: "/bin/bash"

# Define reusable script functions (keyed by interpreter)
functions:
  bash:
    - name: my_shared_func
      source: |
        my_shared_func() { echo "This is a shared utility"; }
  zsh:
    - name: my_shared_func
      source: |
        my_shared_func() { echo "This is a shared utility"; }

# Global script variables mapped to environment
vars:
  global_var: 123

# The actual assertions/validations to run
validations:
  - name: "From other"
    show_output: true
    includes:
      - name: other
        path: other-manifest.yaml
        vars:
          myvar: "$(echo MyyyyyVarrrrr)"
        propagate_tags: false
    tags:
      - gabbledegak
  - name: "Check File Exists"
    tags:
      - "system"
      - "core"
    script: |
      my_shared_func
      if [ -f "/etc/hosts" ]; then
        echo "{{ .app_name }} config found"
        exit 0
      elif [ ! -s "/etc/hosts" ]; then
        exit 2
      else
        exit 1
      fi
    outcomes:
      warn:
        message: "File is present, but empty"
        exit_codes: 
          - 2
      pass:
        message: "File is present"
        exit_codes: 
          - 0
      fail:
        message: "File is missing"

  - name: "SkipMe"
    tags: ["other"]
    script: echo "Running SkipMe"
    show_output: true

  - name: "RunAlso"
    tags: ["run"]
    script: echo "Running RunAlso"
    show_output: true

  - name: "RunMyTag"
    tags: ["my_tag"]
    script: echo "Running RunMyTag"
    show_output: true

  - name: "RunMyConditionalTag"
    tags: 
      - my_tag
    conditions: 
      - eval: "!no_tags()"          # only run when -t flag is provided
      - eval: file_exists("/etc/hosts")
      - eval: 1 == 1 
      - eval: GOOS == "darwin"
    script: echo "Running RunMyTag"
    show_output: true    
