# Define variables available to the template engine
templateVars:
  app_name: "MyApp"

# Global default interpreter and settings
defaults:
  show_output: false
  interpreters:
    script: "/bin/bash"

# Define reusable script functions (keyed by interpreter)
functions:
  bash:
    - name: my_shared_func
      source: |
        my_shared_func() { echo "This is a shared utility"; }
  zsh:
    - name: my_shared_func
      source: |
        my_shared_func() { echo "This is a shared utility"; }

# Global script variables mapped to environment
vars:
  global_var: 123

# The actual assertions/validations to run
validations:
  - name: "From other"
    show_output: true
    includes:
      - name: other
        path: other-manifest.yaml
        propagate_tags: false
    tags:
      - gabbledegak
    loop:
      - name: "Loop 1"
      - name: "Loop 2"
      - name: "Loop 3"
  - name: "Check File Exists"
    notes:
      - Checked file, my app name is {{ .app_name }}
    tags:
      - "system"
      - "core"
    script: |
      my_shared_func
      if [ -f "/etc/hosts" ]; then
        echo "{{ .app_name }} config found"
        exit 0
      elif [ ! -s "/etc/hosts" ]; then
        exit 2
      else
        exit 1
      fi
    loop:
      - name: "Loop 1"
        notes:
          - This is an override for loop 1 [google](https://google.com)
      - name: "Loop 2"
      - name: "Loop 3"      
    outcomes:
      warn:
        message: "File is present, but empty"
        exit_codes: 
          - 2
      pass:
        message: "File is present"
        exit_codes: 
          - 0
      fail:
        message: "File is missing"

  - name: "SkipMe"
    tags: ["other"]
    script: echo "Running SkipMe - $global_var"
    show_output: true
    loop:
      - name: "Loop 1"
        vars:
          myvar: var_from_loop_1
        tags:
          - loop1
      - name: "Loop 2"
        tags:
          - loop2

  - name: "RunAlso"
    tags: ["run"]
    script: echo "Running RunAlso"
    show_output: true

  - name: "RunMyTag"
    tags: ["my_tag"]
    script: echo "Running RunMyTag"
    show_output: true

  - name: "RunMyConditionalTag"
    tags: 
      - my_tag
    conditions: 
      - eval: "!no_tags()"          # only run when -t flag is provided
      - eval: file_exists("/etc/hosts")
      - eval: 1 == 1 
      - eval: GOOS == "darwin"
    script: echo "Running RunMyTag"
    show_output: true    
