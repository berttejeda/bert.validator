name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.goos }} / ${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: '386'
          - goos: linux
            goarch: amd64
          - goos: windows
            goarch: '386'
            ext: .exe
          - goos: windows
            goarch: amd64
            ext: .exe
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DATE=$(date -u +%Y-%m-%d)
          COMMIT="${GITHUB_SHA::7}"
          BIN="validator${{ matrix.ext }}"
          ARCHIVE="bert.validator-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz"
          mkdir -p build
          go build -trimpath \
            -ldflags "-s -w -X main.Version=${VERSION} -X main.GitCommit=${COMMIT} -X main.BuildDate=${DATE}" \
            -o "build/${BIN}"
          tar -czf "${ARCHIVE}" -C build "${BIN}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bert.validator-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bert.validator-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: bert.validator-*

      - name: List artifacts
        run: find dist -type f | sort

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/**/bert.validator-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
